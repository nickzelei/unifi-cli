[tools]
go = "1.27.3"
golangci-lint = "2.15.0"
"go:golang.org/x/tools/cmd/deadcode" = "0.52.0"

[env]
CGO_ENABLED = "0"

[tasks.build]
description = "Build bin/unifi"
run = "go build -trimpath -ldflags \"-s -w -X github.com/nickzelei/unifi-cli/internal/cli.version=$(git describe --tags --always --dirty 2>/dev/null || echo dev)\" -o bin/unifi ./cmd/unifi"

[tasks."release:build"]
description = "Cross-compile release archives and checksums into dist/"
run = """
set -eu
version="${VERSION:-$(git describe --tags --always --dirty)}"
rm -rf dist && mkdir -p dist
for target in darwin/arm64 darwin/amd64 linux/arm64 linux/amd64; do
  os="${target%/*}" arch="${target#*/}"
  name="unifi_${version#v}_${os}_${arch}"
  mkdir -p "dist/$name"
  GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/nickzelei/unifi-cli/internal/cli.version=$version" -o "dist/$name/unifi" ./cmd/unifi
  cp README.md LICENSE "dist/$name/"
  tar -C dist -czf "dist/$name.tar.gz" "$name"
  rm -rf "dist/$name"
done
(cd dist && shasum -a 256 *.tar.gz > checksums.txt)
ls -l dist
"""

[tasks.release]
description = "Tag and publish a release: mise run release -- [-n] VERSION|major|minor|patch"
run = "scripts/release.sh"

[tasks.install]
description = "Install unifi into $GOBIN"
run = "go install -trimpath ./cmd/unifi"

[tasks.test]
description = "Run tests"
run = "go test ./..."

[tasks.lint]
description = "Run golangci-lint and check for dead code"
run = [
  "golangci-lint run",
  # deadcode exits 0 even when it reports unreachable functions.
  "out=$(deadcode -test ./...) || exit 1; test -z \"$out\" || { echo \"$out\"; echo 'dead code found'; exit 1; }",
]

[tasks."lint:fix"]
description = "Apply golangci-lint fixes and formatting"
run = "golangci-lint run --fix"

[tasks.gen]
description = "Regenerate internal/spec/ops_gen.go from the embedded spec"
run = "go generate ./internal/spec"

[tasks."spec:fetch"]
description = "Download the spec from your console (or pass --url <spec url>)"
run = "go run ./internal/cmd/gen fetch"

[tasks."spec:update"]
description = "Fetch the latest spec from your console and regenerate"
depends = ["spec:fetch"]
run = "go generate ./internal/spec"

[tasks.check]
description = "Lint, test, and verify generated code is up to date"
depends = ["lint", "test"]
run = [
  "go generate ./internal/spec",
  "git diff --exit-code -- internal/spec/ops_gen.go",
]

[tasks."skill:install"]
description = "Symlink the agent skill into ~/.claude/skills"
run = "mkdir -p ~/.claude/skills && ln -sfn \"$PWD/skills/unifi\" ~/.claude/skills/unifi && echo linked ~/.claude/skills/unifi"
